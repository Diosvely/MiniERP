# Dependabot: propone actualizaciones de dependencias con un Pull Request que pasa por la misma CI.
# Solo se fusionan en verde. Las actualizaciones menores (minor / patch) llegan juntas en un único PR a la semana.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types: [minor, patch]
    ignore:
      # xlsx se instala desde el CDN oficial de SheetJS, no desde npm: Dependabot no puede actualizarlo.
      # Ni npm audit ni Dependabot lo vigilan: se revisa a mano en cada versión menor del Mini ERP (avisos en
      # https://git.sheetjs.com/sheetjs/sheetjs/issues y en la página de versiones de SheetJS). v0.60.5, SEG-16.
      - dependency-name: xlsx
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
