# =====================================================================
# Integración continua: en cada push y en cada Pull Request a main
#   database → las pruebas SQL (cada una en una base nueva de PostgreSQL 16)
#   frontend → lint, build y auditoría de dependencias de la web
# Si algo falla, el PR sale en rojo y no se debe fusionar.
# =====================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  database:
    name: Pruebas de la base de datos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cliente de PostgreSQL 16
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
      - name: Pruebas SQL
        run: bash scripts/test-db.sh   # con "bash": no depende del permiso de ejecución (Windows no lo guarda)

  frontend:
    name: Web (lint y build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          # La compilación no se conecta a nada: valores de relleno
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_KEY: sb_publishable_ci
      - name: Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high
